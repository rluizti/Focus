<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />
  
  <!-- Outer Focus Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8 6" filter="url(#glow)" />
  
  <!-- Inner Focus Target Reticle -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
  
  <!-- Center Core dot -->
  <circle cx="64" cy="64" r="8" fill="url(#ringGrad)" />
  
  <!-- Crosshair tick marks -->
  <line x1="64" y1="18" x2="64" y2="28" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="100" x2="64" y2="110" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="64" x2="28" y2="64" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="64" x2="110" y2="64" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
</svg>
